# UGREEN NAS DXP2800 / UGOS Pro — exclusive Docker Compose
# No secrets here: credentials live in config.env (env_file + bind mount).
#
# ONE bind mount for the whole media library so Path.replace() never hits EXDEV:
#   /volume1/Media → /data/media
#
# Layout (siblings under the same mount):
#   /data/media/Downloads/Inbox
#   /data/media/Movies
#   /data/media/Series
#   /data/media/Documentaries
#   /data/media/Home Videos

services:
  telegram-downloader:
    build: .
    container_name: telegram-video-downloader
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8765}:8765"
    env_file:
      - /volume1/docker/telegram-downloader/config.env
    environment:
      SERVICE_BACKEND: process
      NOTIFY: "false"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8765"
      DOWNLOAD_DIR: /data/media/Downloads
      DATA_DIR: /app/data
      SESSION_NAME: /app/data/telegram_session
      STATE_FILE: /app/data/downloaded.json
      PROGRESS_FILE: /app/data/downloader.progress
      MANUAL_QUEUE_FILE: /app/data/manual_download_queue.json
      LOG_PATH: /app/data/downloader.log
    volumes:
      # Secrets / config (read-only). Do not put API keys in this YAML.
      - /volume1/docker/telegram-downloader/config.env:/app/config.env:ro
      # Persistent app state: Telethon session, download history, manual queue,
      # progress, logs (and TMDb cache if/when a classifier lands under DATA_DIR).
      - /volume1/docker/telegram-downloader/data:/app/data
      # Entire media library — single mount keeps renames on one filesystem.
      - /volume1/Media:/data/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/status', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
